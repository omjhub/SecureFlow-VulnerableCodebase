title = "SecureFlow custom Gitleaks rules"

[[rules]]
id = "flask-secret-key"
description = "Flask SECRET_KEY assigned as a literal string"
regex = '''(?i)(SECRET_KEY|JWT_SECRET|SESSION_SECRET)\s*=\s*['"][^'"]{4,}['"]'''
tags = ["flask", "secret", "hardcoded"]

[[rules]]
id = "postgres-connection-string"
description = "Hardcoded PostgreSQL connection string or password assignment"
regex = '''(?i)(POSTGRES_PASSWORD|DB_PASSWORD)\s*[:=]\s*['"][^'"]{4,}['"]'''
tags = ["database", "secret", "hardcoded"]

[[rules]]
id = "postgres-uri"
description = "Full PostgreSQL connection URI with embedded credentials"
regex = '''postgres(?:ql)?:\/\/[^:\s]+:[^@\s]+@[^\/\s]+'''
tags = ["database", "connection-string"]

[extend]
useDefault = true
