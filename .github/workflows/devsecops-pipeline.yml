name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          gitleaks detect \
            --source . \
            --log-opts='--all' \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sast-scan:
    name: SonarQube SAST Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=omjhub
            -Dsonar.projectKey=omjhub_SecureFlow-VulnerableCodebase

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch findings and evaluate differentiated gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE_PARAM="pullRequest=${{ github.event.pull_request.number }}"
          else
            SCOPE_PARAM="branch=${{ github.ref_name }}"
          fi

          echo "Querying SonarQube with: $SCOPE_PARAM"

          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=omjhub_SecureFlow-VulnerableCodebase&resolved=false&ps=500&${SCOPE_PARAM}" \
            -o sonar-findings.json

          CRITICAL_COUNT=$(jq '[.issues[] | select(.severity=="CRITICAL" or .severity=="BLOCKER")] | length' sonar-findings.json)
          TOTAL_COUNT=$(jq '.total' sonar-findings.json)
          echo "Total findings: $TOTAL_COUNT"
          echo "CRITICAL/BLOCKER findings: $CRITICAL_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Hard-fail: CRITICAL/BLOCKER findings present."
            exit 1
          else
            echo "No CRITICAL/BLOCKER findings — findings archived for security gate, merge not blocked."
          fi

      - name: Upload findings artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-findings
          path: sonar-findings.json

  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build auth-service image
        run: docker build -t auth-service:scan ./services/auth-service

      - name: Build transaction-service image
        run: docker build -t transaction-service:scan ./services/transaction-service

      - name: Build frontend image
        run: docker build -t frontend:scan ./services/frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:scan
          format: json
          output: trivy-auth-service.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transaction-service:scan
          format: json
          output: trivy-transaction-service.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Evaluate hard-fail on CRITICAL/HIGH
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          TOTAL=0
          for f in trivy-auth-service.json trivy-transaction-service.json trivy-frontend.json; do
            COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' "$f")
            echo "$f: $COUNT CRITICAL/HIGH findings"
            TOTAL=$((TOTAL + COUNT))
          done
          echo "Total CRITICAL/HIGH across all images: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "Hard-fail: CRITICAL/HIGH CVEs present."
            exit 1
          fi

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: trivy-*.json

  k8s-iac-scan:
    name: Trivy K8s Config Scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy config scan — Kubernetes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: json
          output: trivy-k8s-report.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Evaluate K8s findings
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' trivy-k8s-report.json)
          echo "K8s CRITICAL/HIGH misconfigurations: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "Hard-fail: CRITICAL/HIGH K8s misconfigurations present."
            exit 1
          fi

      - name: Upload K8s scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-k8s-report
          path: trivy-k8s-report.json

  terraform-iac-scan:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: cli,json
          output_file_path: console,checkov-report.json
          soft_fail: true

      - name: Evaluate Checkov findings
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          COUNT=$(jq '.results.failed_checks | length' checkov-report.json 2>/dev/null || echo 0)
          echo "Checkov failed checks: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "Hard-fail: Checkov IaC misconfigurations present."
            exit 1
          fi

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      [secret-scan, sast-scan, image-scan, k8s-iac-scan, terraform-iac-scan]
    if: always()
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Download all scanner artifacts
        uses: actions/download-artifact@v4
        with:
          path: gate-artifacts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Aggregate findings and apply differentiated gate
        id: gate
        run: |
          echo "## Security Gate Report" > pr-comment.md
          echo "" >> pr-comment.md

          # --- DevSecOps-owned: Gitleaks ---
          GITLEAKS_COUNT=0
          if [ -f gate-artifacts/gitleaks-report/gitleaks-report.json ]; then
            GITLEAKS_COUNT=$(jq 'length' gate-artifacts/gitleaks-report/gitleaks-report.json 2>/dev/null || echo 0)
          fi

          # --- DevSecOps-owned: Trivy image ---
          TRIVY_IMG_COUNT=0
          for f in gate-artifacts/trivy-image-reports/trivy-*.json; do
            [ -f "$f" ] || continue
            C=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' "$f" 2>/dev/null || echo 0)
            TRIVY_IMG_COUNT=$((TRIVY_IMG_COUNT + C))
          done

          # --- DevSecOps-owned: Trivy K8s ---
          TRIVY_K8S_COUNT=0
          if [ -f gate-artifacts/trivy-k8s-report/trivy-k8s-report.json ]; then
            TRIVY_K8S_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' gate-artifacts/trivy-k8s-report/trivy-k8s-report.json 2>/dev/null || echo 0)
          fi

          # --- DevSecOps-owned: Checkov ---
          CHECKOV_COUNT=0
          if [ -f gate-artifacts/checkov-report/checkov-report.json ]; then
            CHECKOV_COUNT=$(jq '.results.failed_checks | length' gate-artifacts/checkov-report/checkov-report.json 2>/dev/null || echo 0)
          fi

          DEVSECOPS_TOTAL=$((GITLEAKS_COUNT + TRIVY_IMG_COUNT + TRIVY_K8S_COUNT + CHECKOV_COUNT))

          # --- AppSec-owned: SonarQube ---
          SONAR_COUNT=0
          if [ -f gate-artifacts/sonarqube-findings/sonar-findings.json ]; then
            SONAR_COUNT=$(jq '.total' gate-artifacts/sonarqube-findings/sonar-findings.json 2>/dev/null || echo 0)
          fi

          echo "### DevSecOps-Owned Findings (blocking)" >> pr-comment.md
          echo "- Gitleaks (secrets): $GITLEAKS_COUNT" >> pr-comment.md
          echo "- Trivy image scan (CRITICAL/HIGH CVEs): $TRIVY_IMG_COUNT" >> pr-comment.md
          echo "- Trivy K8s config scan (CRITICAL/HIGH): $TRIVY_K8S_COUNT" >> pr-comment.md
          echo "- Checkov Terraform scan (failed checks): $CHECKOV_COUNT" >> pr-comment.md
          echo "" >> pr-comment.md
          echo "### AppSec-Owned Findings (routed, non-blocking)" >> pr-comment.md
          echo "- SonarQube (application code): $SONAR_COUNT — [AppSec intake](../../docs/security-gate-policy.md)" >> pr-comment.md
          echo "" >> pr-comment.md

          echo "devsecops_total=$DEVSECOPS_TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$DEVSECOPS_TOTAL" -gt 0 ]; then
            echo "**Result: BLOCKED** — DevSecOps-owned findings present ($DEVSECOPS_TOTAL total)." >> pr-comment.md
            echo "gate_status=blocked" >> "$GITHUB_OUTPUT"
          else
            echo "**Result: PASSED** — no DevSecOps-owned findings." >> pr-comment.md
            echo "gate_status=passed" >> "$GITHUB_OUTPUT"
          fi

          cat pr-comment.md

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Enforce gate result
        run: |
          if [ "${{ steps.gate.outputs.gate_status }}" = "blocked" ]; then
            echo "Security Gate: BLOCKED (DevSecOps-owned findings present)"
            exit 1
          fi
          echo "Security Gate: PASSED"

