# SecureFlow docker-compose
# Day 7 remediation: postgres pinned to SHA digest, all hardcoded
# credentials moved to environment variable substitution from .env
# (gitignored, scrubbed from git history).

services:
  auth-db:
    image: postgres:14@sha256:caf49e3b10d377aa2cfee478591d623808527beb27125d38797b418013f72d81
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5434:5432" # IV-02 — still exposed on host; remapped locally due to port 5432 conflict (see Day 1 notes).
    volumes:
      - ./db/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - auth-db-data:/var/lib/postgresql/data

  transaction-db:
    image: postgres:14@sha256:caf49e3b10d377aa2cfee478591d623808527beb27125d38797b418013f72d81
    environment:
      POSTGRES_DB: transactiondb
      POSTGRES_USER: txuser
      POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD}
    ports:
      - "5433:5432" # IV-02 — still exposed on host; not in Day 7 scope.
    volumes:
      - ./db/transaction/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - transaction-db-data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USER: authuser
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5001:5001"
    depends_on:
      - auth-db

  transaction-service:
    build: ./services/transaction-service
    environment:
      DB_HOST: transaction-db
      DB_PORT: 5432
      DB_NAME: transactiondb
      DB_USER: txuser
      DB_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:5001
    ports:
      - "5002:5002"
    depends_on:
      - transaction-db
      - auth-service

  frontend:
    build: ./services/frontend
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_SERVICE_URL: http://auth-service:5001
      TRANSACTION_SERVICE_URL: http://transaction-service:5002
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - transaction-service

volumes:
  auth-db-data:
  transaction-db-data:
# IV-06 — no resource limits, still not in Day 7 scope (Day 8+).
# IV-07 — no network segmentation, still not in Day 7 scope (Day 8+).
