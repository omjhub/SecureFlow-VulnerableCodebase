    app: network-policy
    team: devsecops
spec:
  podSelector:
    matchLabels:
      svc: auth-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              svc: frontend
      ports:
        - protocol: TCP
          port: 5001

