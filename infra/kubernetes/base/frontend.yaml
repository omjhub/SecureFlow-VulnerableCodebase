apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: secureflow
  labels:
    app: frontend
    team: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      svc: frontend
  template:
    metadata:
      labels:
        svc: frontend
        app: frontend
        team: devsecops
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "frontend-role"
        vault.hashicorp.com/agent-json-patch: '[{"op":"add","path":"/securityContext","value":{"readOnlyRootFilesystem":true,"allowPrivilegeEscalation":false,"runAsNonRoot":true,"runAsUser":100,"capabilities":{"drop":["ALL"]}}}]'
        vault.hashicorp.com/agent-init-json-patch: '[{"op":"add","path":"/securityContext","value":{"readOnlyRootFilesystem":true,"allowPrivilegeEscalation":false,"runAsNonRoot":true,"runAsUser":100,"capabilities":{"drop":["ALL"]}}}]'
        vault.hashicorp.com/agent-inject-template-frontend-secrets: |
          {{- with secret "secureflow/data/frontend" -}}
          export SESSION_SECRET="{{ .Data.data.SESSION_SECRET }}"
          {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: tmp
          emptyDir: {}
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: localhost:5001/secureflow/frontend@sha256:d10b2574a40e2528c5585b1cbcd0e4bf61924e7db45b82e66fe5e404a890b7a8
          command: ["/bin/sh", "-c"]
          args:
            - . /vault/secrets/frontend-secrets && exec python app.py
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: secureflow-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: secureflow
  labels:
    app: frontend
    team: devsecops
spec:
  type: NodePort
  selector:
    svc: frontend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
